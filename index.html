
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Candy Pop Mania — Ultimate Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4da6;--purple:#6529ae;--gold:#ffe66d}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;text-align:center;color:white;
 font-family:Fredoka,system-ui;
 background:
 radial-gradient(ellipse at 50% 0%,#fca9e1 0%,transparent 38%),
 radial-gradient(ellipse at 0% 80%,#6e4bd1,transparent 50%),
 linear-gradient(145deg,#291451,#140b32);
 overflow-x:hidden
}
header{padding:15px 8px 5px}
h1{font:clamp(24px,6vw,39px) Bungee;color:#fff;margin:0;
 text-shadow:0 4px #a32a9c,0 8px 15px #ff60cb}
.subtitle{font-size:13px;color:#ffe5fa}
.stats{display:flex;justify-content:center;gap:8px;margin:13px auto;flex-wrap:wrap}
.stat{background:linear-gradient(145deg,#ffffff35,#ffffff0c);border:1px solid #ffffff55;
 border-radius:15px;padding:7px 15px;min-width:85px;box-shadow:0 5px 12px #0003}
.stat small{display:block;font-size:11px;color:#e7d4ff}
.stat strong{font-size:21px}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}
button{font:700 14px Fredoka;cursor:pointer;border:0}
.btn{padding:10px 16px;border-radius:25px;color:white;
 background:linear-gradient(135deg,#ff58b2,#a13cce);
 box-shadow:0 4px #60237e,0 7px 13px #0004}
.btn:active{transform:translateY(3px);box-shadow:0 1px #60237e}
.bluebtn{background:linear-gradient(135deg,#44b6ff,#5146ce);box-shadow:0 4px #292c85}
#game{width:min(95vw,490px);margin:10px auto 18px;position:relative}
#board{position:relative;width:100%;aspect-ratio:1;overflow:hidden;
 border:4px solid #d6aaff;border-radius:20px;
 background:linear-gradient(145deg,#29164e,#39206c);
 box-shadow:0 12px 35px #08031caa,inset 0 0 20px #0008;
 touch-action:none}
.cell{position:absolute;width:12.5%;height:12.5%;
 border:1px solid #ffffff13;background:#ffffff0a}
.cell:nth-child(4n){background:#ffffff12}
.tile{position:absolute;width:12.5%;height:12.5%;padding:4px;
 display:flex;align-items:center;justify-content:center;z-index:2;
 transition:transform .38s cubic-bezier(.2,.75,.2,1),opacity .25s,filter .2s;
 will-change:transform;user-select:none}
.candy{width:100%;height:100%;position:relative;display:flex;
 align-items:center;justify-content:center;border-radius:36%;
 font-size:clamp(22px,6vw,37px);
 border:2px solid #ffffffa0;
 box-shadow:inset 0 4px 5px #ffffffb0,inset 0 -6px 8px #0004,0 4px 5px #0006;
 transform:rotate(-5deg);
 transition:transform .16s,filter .16s}
.candy:before{content:"";position:absolute;top:11%;left:18%;width:38%;height:16%;
 border-radius:50%;background:#ffffffad;filter:blur(1px);transform:rotate(-28deg)}
.candy:after{content:"";position:absolute;bottom:9%;right:15%;width:17%;height:10%;
 border-radius:50%;background:#ffffff4a}
.candy.red{background:linear-gradient(145deg,#ffb0b4,#fa245b)}
.candy.blue{background:linear-gradient(145deg,#a5f3ff,#1478ed)}
.candy.green{background:linear-gradient(145deg,#d0ff9c,#28b85c)}
.candy.yellow{background:linear-gradient(145deg,#fffbb4,#ffb600)}
.candy.purple{background:linear-gradient(145deg,#f1b0ff,#9135e7)}
.candy.orange{background:linear-gradient(145deg,#ffe0a5,#ff7625)}
.candy.choco{background:linear-gradient(145deg,#b77b55,#542417);border-color:#ffe0bd}
.candy.pink{background:linear-gradient(145deg,#ffd0ed,#f044ad)}
.tile.selected .candy{transform:scale(1.15) rotate(0);filter:brightness(1.35);
 outline:3px solid white;box-shadow:0 0 16px white}
.tile.shaking .candy{animation:shake .42s ease-in-out}
@keyframes shake{
 0%,100%{transform:rotate(0) scale(1)}
 20%{transform:rotate(-9deg) scale(1.1)}
 40%{transform:rotate(9deg) scale(1.13)}
 60%{transform:rotate(-6deg) scale(1.12)}
 80%{transform:rotate(5deg) scale(1.08)}
}
.tile.clearing{animation:clearCandy .48s ease-in forwards;z-index:5}
@keyframes clearCandy{
 0%{transform:scale(1);opacity:1;filter:brightness(1)}
 35%{transform:scale(1.2);opacity:1;filter:brightness(2)}
 65%{transform:scale(1.12);opacity:.9}
 100%{transform:scale(.05) rotate(35deg);opacity:0}
}
.tile.spawn{animation:spawn .4s cubic-bezier(.2,1.7,.3,1)}
@keyframes spawn{from{opacity:0;transform:scale(.3)}to{opacity:1}}
.tile.striped .candy{border:3px dashed white;box-shadow:0 0 13px white}
.tile.wrapped .candy{border:3px solid #fff;box-shadow:0 0 16px #ffb6ff}
.tile.rainbow .candy{background:conic-gradient(red,#ffbd35,#ffff55,#3de88c,#37aaff,#b84aff,#ff58be,red);
 border:3px solid white;box-shadow:0 0 18px #fff}
.tile.rainbow .candy:before{background:#fff}
#celebrate{position:absolute;z-index:20;left:50%;top:45%;width:120%;
 transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;
 font:clamp(25px,7vw,43px) Bungee;color:#fff;
 text-shadow:0 4px #b32a98,0 8px #542078,0 0 20px #ffec7a}
#celebrate.show{animation:wordPop 1.45s ease-out forwards}
@keyframes wordPop{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}
 15%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(4deg)}
 28%{transform:translate(-50%,-50%) scale(1) rotate(0)}
 78%{opacity:1}
 100%{opacity:0;transform:translate(-50%,-65%) scale(.9)}
}
.float{position:absolute;z-index:15;pointer-events:none;font:16px Bungee;
 color:#fff;text-shadow:0 2px 5px #512477;animation:float .95s ease-out forwards}
@keyframes float{to{transform:translateY(-48px) scale(1.25);opacity:0}}
.particle{position:absolute;z-index:12;width:8px;height:8px;border-radius:50%;
 pointer-events:none;animation:particle .7s ease-out forwards}
@keyframes particle{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
#hint{min-height:24px;color:#f7dfff;font-size:13px;margin:5px}
#help{font-size:11px;color:#d8c8f6;line-height:1.7;margin:10px}
#overlay{display:none;position:fixed;inset:0;z-index:50;background:#100522df;
 align-items:center;justify-content:center;padding:20px}
#overlay.show{display:flex}
.modal{width:min(90vw,350px);padding:25px;border-radius:25px;
 background:linear-gradient(145deg,#8b3bc6,#34205e);border:2px solid #fff8;
 box-shadow:0 15px 50px #0009}
.modal h2{font:24px Bungee;color:#ffe66d;margin:0 0 10px}
#boosters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px auto}
.boost{border-radius:16px;padding:10px 13px;background:linear-gradient(145deg,#398cf8,#6334c2);
 color:white;box-shadow:0 4px #25226f}
.boost.active{outline:3px solid #ffe66d}
@media(max-width:380px){.tile{padding:3px}.stat{min-width:73px;padding:6px 9px}}
</style>
</head>
<body>
<header>
<h1>🍬 CANDY POP MANIA 🍫</h1>
<div class="subtitle">The sweetest match adventure!</div>
</header>

<div class="stats">
 <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
 <div class="stat"><small>MOVES</small><strong id="moves">30</strong></div>
 <div class="stat"><small>BEST</small><strong id="best">0</strong></div>
</div>

<div class="controls">
 <button class="btn" id="new">↻ New Game</button>
 <button class="btn bluebtn" id="hintBtn">✦ Hint</button>
 <button class="btn bluebtn" id="mode">Adventure</button>
</div>

<div id="boosters">
 <button class="boost" data-boost="hammer">🔨 Hammer</button>
 <button class="boost" data-boost="shuffle">🌀 Shuffle</button>
 <button class="boost" data-boost="color">🌈 Color Pop</button>
</div>

<div id="game">
 <div id="board"></div>
 <div id="celebrate"></div>
</div>
<div id="hint">Swipe candies to match 3 or more!</div>
<div id="help">
 4 in a row = STRIPED CANDY ✨ &nbsp; 5 in a row = RAINBOW 🌈<br>
 T or L match = WRAPPED BOMB 💣 &nbsp; Combine specials for BIG BLASTS!
</div>

<div id="overlay">
 <div class="modal">
  <h2 id="endTitle">SUGAR RUSH!</h2>
  <p id="endText">Great game!</p>
  <button class="btn" id="again">Play Again 🍬</button>
 </div>
</div>

<script>
(()=>{
"use strict";
const SIZE=8;
const TYPES=[
 {color:"red",icon:"🍓"},{color:"blue",icon:"🫐"},
 {color:"green",icon:"🍏"},{color:"yellow",icon:"🍋"},
 {color:"purple",icon:"🍇"},{color:"orange",icon:"🍊"},
 {color:"choco",icon:"🍫"},{color:"pink",icon:"🍬"}
];
const board=document.getElementById("board");
const scoreEl=document.getElementById("score");
const movesEl=document.getElementById("moves");
const bestEl=document.getElementById("best");
const word=document.getElementById("celebrate");
const hintEl=document.getElementById("hint");
let grid=[],nodes=new Map(),id=1,score=0,moves=30,best=+(localStorage.cpmBest||0);
let busy=false,selected=null,mode="Adventure",endless=false,boost=null,lastSwap=null;
let wordTimer=null;
bestEl.textContent=best;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const key=(r,c)=>r+","+c;
const pos=k=>k.split(",").map(Number);
const inside=(r,c)=>r>=0&&r<SIZE&&c>=0&&c<SIZE;
const randomType=()=>TYPES[Math.floor(Math.random()*TYPES.length)];
const makeCandy=(type)=>({id:id++,color:type.color,icon:type.icon,special:"",direction:"h"});
function say(t){hintEl.textContent=t}
function popWord(t){
 word.textContent=t;word.classList.remove("show");void word.offsetWidth;
 word.classList.add("show");clearTimeout(wordTimer);
 wordTimer=setTimeout(()=>word.classList.remove("show"),1500);
}
function newBoard(){
 grid=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
 for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
  let t;
  do{t=randomType()}while(
   c>=2&&grid[r][c-1].color===t.color&&grid[r][c-2].color===t.color ||
   r>=2&&grid[r-1][c].color===t.color&&grid[r-2][c].color===t.color
  );
  grid[r][c]=makeCandy(t);
 }
}
function buildBackground(){
 board.innerHTML="";
 for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
  let e=document.createElement("div");e.className="cell";
  e.style.left=c*12.5+"%";e.style.top=r*12.5+"%";board.appendChild(e);
 }
 nodes.clear();
}
function render(){
 const size=board.clientWidth/SIZE,live=new Set();
 for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
  const x=grid[r][c];if(!x)continue;
  live.add(x.id);
  let el=nodes.get(x.id);
  if(!el){
   el=document.createElement("div");el.className="tile spawn";
   el.dataset.id=x.id;
   const candy=document.createElement("div");candy.className="candy";
   el.appendChild(candy);board.appendChild(el);nodes.set(x.id,el);
   requestAnimationFrame(()=>el.classList.remove("spawn"));
  }
  el.className="tile"+(x.special?" "+x.special:"")+
   (selected&&selected.r===r&&selected.c===c?" selected":"");
  const face=el.firstChild;face.className="candy "+x.color;
  face.textContent=x.special==="rainbow"?"🌈":
   x.special==="wrapped"?"💣":
   x.special==="striped"?(x.direction==="v"?"↕":"↔"):x.icon;
  el.style.width=size+"px";el.style.height=size+"px";
  el.style.transform=`translate(${c*size}px,${r*size}px)`;
 }
 for(const [i,el] of nodes){
  if(!live.has(i)){el.remove();nodes.delete(i)}
 }
 scoreEl.textContent=score.toLocaleString();
 movesEl.textContent=endless?"∞":moves;
 bestEl.textContent=best.toLocaleString();
}
function fx(r,c){
 const size=board.clientWidth/SIZE;
 const e=document.createElement("div");e.className="float";
 e.textContent="+"+Math.round(60);
 e.style.left=(c*size+size/2-20)+"px";
 e.style.top=(r*size+size/2-10)+"px";
 board.appendChild(e);setTimeout(()=>e.remove(),1000);
 for(let i=0;i<9;i++){
  const p=document.createElement("i");p.className="particle";
  p.style.left=(c*size+size/2)+"px";p.style.top=(r*size+size/2)+"px";
  p.style.background=["#fff16d","#ff69bc","#6eeaff","#aaff89"][i%4];
  p.style.setProperty("--x",(Math.random()*100-50)+"px");
  p.style.setProperty("--y",(Math.random()*100-50)+"px");
  board.appendChild(p);setTimeout(()=>p.remove(),750);
 }
}
function matches(){
 const runs=[];
 for(let r=0;r<SIZE;r++){
  let c=0;
  while(c<SIZE){
   let end=c+1;
   while(end<SIZE&&grid[r][c]&&grid[r][end]&&grid[r][c].color===grid[r][end].color)end++;
   if(grid[r][c]&&end-c>=3)runs.push({cells:Array.from({length:end-c},(_,i)=>key(r,c+i)),dir:"h",len:end-c});
   c=end;
  }
 }
 for(let c=0;c<SIZE;c++){
  let r=0;
  while(r<SIZE){
   let end=r+1;
   while(end<SIZE&&grid[r][c]&&grid[end][c]&&grid[r][c].color===grid[end][c].color)end++;
   if(grid[r][c]&&end-r>=3)runs.push({cells:Array.from({length:end-r},(_,i)=>key(r+i,c)),dir:"v",len:end-r});
   r=end;
  }
 }
 const groups=[];
 for(const run of runs){
  const touching=groups.filter(g=>run.cells.some(k=>g.cells.has(k)));
  if(!touching.length){groups.push({cells:new Set(run.cells),runs:[run]});continue}
  const g=touching[0];run.cells.forEach(k=>g.cells.add(k));g.runs.push(run);
  for(const other of touching.slice(1)){
   other.cells.forEach(k=>g.cells.add(k));g.runs.push(...other.runs);
   groups.splice(groups.indexOf(other),1);
  }
 }
 return groups;
}
function typeFor(g){
 if(g.runs.some(a=>a.dir==="h")&&g.runs.some(a=>a.dir==="v"))return "wrapped";
 if(g.runs.some(a=>a.len>=5))return "rainbow";
 if(g.runs.some(a=>a.len===4))return "striped";
 return "";
}
function keepCell(g){
 if(lastSwap){
  for(const p of lastSwap)if(g.cells.has(key(p.r,p.c)))return key(p.r,p.c);
 }
 return [...g.cells][Math.floor(g.cells.size/2)];
}
function expandSpecials(clear){
 const queue=[...clear],seen=new Set();
 while(queue.length){
  const k=queue.shift();if(seen.has(k))continue;seen.add(k);
  const [r,c]=pos(k),x=grid[r]?.[c];if(!x?.special)continue;
  const add=k2=>{if(!clear.has(k2)){clear.add(k2);queue.push(k2)}};
  if(x.special==="striped"){
   for(let i=0;i<SIZE;i++){add(key(r,i));add(key(i,c))}
  }else if(x.special==="wrapped"){
   for(let rr=r-1;rr<=r+1;rr++)for(let cc=c-1;cc<=c+1;cc++)if(inside(rr,cc))add(key(rr,cc));
  }else if(x.special==="rainbow"){
   for(let rr=0;rr<SIZE;rr++)for(let cc=0;cc<SIZE;cc++)
    if(grid[rr][cc]?.color===x.targetColor)add(key(rr,cc));
  }
 }
}
function combo(a,b){
 const A=grid[a.r][a.c],B=grid[b.r][b.c],clear=new Set();
 if(A.special==="rainbow"&&B.special==="rainbow"){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)clear.add(key(r,c));
 }else if(A.special==="rainbow"||B.special==="rainbow"){
  const rainbow=A.special==="rainbow"?A:B,other=rainbow===A?B:A;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
   const x=grid[r][c];
   if(x?.color===other.color){
    if(other.special){x.special=other.special;x.targetColor=other.color}
    clear.add(key(r,c));
   }
  }
  for(const k of clear){const [r,c]=pos(k);if(grid[r][c])grid[r][c].targetColor=other.color}
  expandSpecials(clear);
 }else if(A.special==="striped"&&B.special==="striped"){
  for(let i=0;i<SIZE;i++){
   clear.add(key(a.r,i));clear.add(key(i,a.c));
   clear.add(key(b.r,i));clear.add(key(i,b.c));
  }
 }else if(A.special==="wrapped"&&B.special==="wrapped"){
  for(let r=Math.min(a.r,b.r)-2;r<=Math.max(a.r,b.r)+2;r++)
   for(let c=Math.min(a.c,b.c)-2;c<=Math.max(a.c,b.c)+2;c++)if(inside(r,c))clear.add(key(r,c));
 }else{
  for(let i=0;i<SIZE;i++){clear.add(key(a.r,i));clear.add(key(i,a.c))}
  for(let r=b.r-2;r<=b.r+2;r++)for(let c=b.c-2;c<=b.c+2;c++)if(inside(r,c))clear.add(key(r,c));
 }
 expandSpecials(clear);return clear;
}
function gravity(){
 for(let c=0;c<SIZE;c++){
  let write=SIZE-1;
  for(let r=SIZE-1;r>=0;r--)if(grid[r][c]){
   const x=grid[r][c];grid[r][c]=null;grid[write][c]=x;write--;
  }
  for(let r=write;r>=0;r--)grid[r][c]=makeCandy(randomType());
 }
}
function words(groups,chain){
 if(chain>=4)return "UNBELIEVABLE!";
 if(groups.some(g=>typeFor(g)==="wrapped"))return "TREMENDOUS!";
 if(groups.some(g=>typeFor(g)==="rainbow"))return "EPIC!";
 if(groups.some(g=>typeFor(g)==="striped"))return "SWEET!";
 if(chain>=2)return "AMAZING!";
 if(groups.some(g=>g.cells.size>=6))return "SUGAR RUSH!";
 return "DELICIOUS!";
}
async function resolve(initial=null){
 let chain=0,clear=initial;
 while(chain<12){
  let groups=matches();
  if(!clear&&!groups.length)break;
  chain++;clear=clear||new Set();
  for(const g of groups){
   const special=typeFor(g);
   if(special){
    const keep=keepCell(g),[r,c]=pos(keep),x=grid[r][c];
    if(x){x.special=special;x.direction=g.runs.find(a=>a.len===4)?.dir||"h";
     x.targetColor=x.color}
    for(const k of g.cells)if(k!==keep)clear.add(k);
   }else for(const k of g.cells)clear.add(k);
  }
  expandSpecials(clear);
  const points=[];
  for(const k of clear){const [r,c]=pos(k);if(grid[r][c])points.push({r,c})}
  if(!points.length)break;
  popWord(words(groups,chain));
  const gain=points.length*60*chain;score+=gain;
  if(score>best){best=score;localStorage.cpmBest=best}
  for(const p of points){
   const el=nodes.get(grid[p.r][p.c].id);
   if(el){el.classList.add("clearing","shaking")}
   fx(p.r,p.c);
  }
  render();
  // Slow, satisfying match pause — no instant blinking.
  await sleep(480);
  for(const p of points)grid[p.r][p.c]=null;
  render();
  await sleep(90);
  gravity();render();
  // Give falling candies time to settle before checking cascades.
  await sleep(440);
  clear=null;
 }
 render();
 if(!endless&&moves<=0)finish();
}
async function swap(a,b){
 if(busy||!inside(b.r,b.c)||Math.abs(a.r-b.r)+Math.abs(a.c-b.c)!==1)return;
 const A=grid[a.r][a.c],B=grid[b.r][b.c];if(!A||!B)return;
 busy=true;selected=null;lastSwap=[a,b];
 [grid[a.r][a.c],grid[b.r][b.c]]=[B,A];render();
 await sleep(260);
 let clear;
 if(A.special||B.special)clear=combo(a,b);
 else if(matches().length)clear=null;
 else{
  [grid[a.r][a.c],grid[b.r][b.c]]=[A,B];render();
  await sleep(220);lastSwap=null;busy=false;return;
 }
 if(!endless)moves--;
 await resolve(clear);
 lastSwap=null;busy=false;
 if(!endless&&moves<=0)finish();
}
function hint(){
 for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)for(const [dr,dc] of [[0,1],[1,0]]){
  const rr=r+dr,cc=c+dc;if(!inside(rr,cc))continue;
  [grid[r][c],grid[rr][cc]]=[grid[rr][cc],grid[r][c]];
  const ok=matches().length>0||grid[r][c].special||grid[rr][cc].special;
  [grid[r][c],grid[rr][cc]]=[grid[rr][cc],grid[r][c]];
  if(ok)return [{r,c},{r:rr,c:cc}];
 }
 return null;
}
function finish(){
 document.getElementById("endTitle").textContent="SUGAR RUSH!";
 document.getElementById("endText").textContent="Your score: "+score.toLocaleString();
 document.getElementById("overlay").classList.add("show");
}
function start(){
 score=0;moves=30;busy=false;selected=null;lastSwap=null;boost=null;
 endless=mode==="Endless";newBoard();buildBackground();render();
 say(endless?"Endless mode — play as long as you like!":"Swipe to match candies and make combos!");
 document.getElementById("overlay").classList.remove("show");
 document.querySelectorAll(".boost").forEach(b=>b.classList.remove("active"));
}
let down=null;
board.addEventListener("pointerdown",e=>{
 if(busy)return;
 const rect=board.getBoundingClientRect(),s=rect.width/SIZE;
 const c=Math.floor((e.clientX-rect.left)/s),r=Math.floor((e.clientY-rect.top)/s);
 if(inside(r,c))down={r,c,x:e.clientX,y:e.clientY};
});
board.addEventListener("pointerup",e=>{
 if(!down||busy)return;
 const a=down;down=null;
 const dx=e.clientX-a.x,dy=e.clientY-a.y;
 if(boost){
  useBoost(a);return;
 }
 if(Math.max(Math.abs(dx),Math.abs(dy))>12){
  let r=a.r,c=a.c;
  if(Math.abs(dx)>Math.abs(dy))c+=dx>0?1:-1;else r+=dy>0?1:-1;
  swap(a,{r,c});
 }else if(!selected){selected=a;render()}
 else if(selected.r===a.r&&selected.c===a.c){selected=null;render()}
 else if(Math.abs(selected.r-a.r)+Math.abs(selected.c-a.c)===1)swap(selected,a);
 else{selected=a;render()}
});
function chooseBoost(name){
 if(busy)return;
 boost=boost===name?null:name;
 document.querySelectorAll(".boost").forEach(b=>b.classList.toggle("active",b.dataset.boost===boost));
 say(boost?"Tap a candy to use "+boost+"!":"Booster cancelled");
}
async function useBoost(p){
 if(!boost)return;
 const name=boost;boost=null;busy=true;
 document.querySelectorAll(".boost").forEach(b=>b.classList.remove("active"));
 const clear=new Set();
 if(name==="hammer")clear.add(key(p.r,p.c));
 if(name==="color"){
  const target=grid[p.r][p.c].color;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c].color===target)clear.add(key(r,c));
 }
 if(name==="shuffle"){
  const all=grid.flat().sort(()=>Math.random()-.5);
  grid=Array.from({length:SIZE},(_,r)=>all.slice(r*SIZE,(r+1)*SIZE));
  render();await sleep(300);
  // If shuffle creates a match, resolve it.
  if(matches().length)await resolve();busy=false;return;
 }
 await resolve(clear);busy=false;
}
document.querySelectorAll(".boost").forEach(b=>b.onclick=()=>chooseBoost(b.dataset.boost));
document.getElementById("new").onclick=start;
document.getElementById("again").onclick=start;
document.getElementById("hintBtn").onclick=()=>{
 if(busy)return;
 const h=hint();
 if(h){selected=h[0];render();say("Try this move! ✨");setTimeout(()=>{selected=null;render()},1200)}
 else say("No moves found!");
};
document.getElementById("mode").onclick=()=>{
 mode=mode==="Adventure"?"Endless":"Adventure";
 document.getElementById("mode").textContent=mode;start();
};
window.addEventListener("resize",render);
start();
})();
</script>
